name: Deploy Static Web App
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: static-web-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Validate before deployment
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
          az bicep build --file infra/main.bicep
      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/web
          api_location: src/api
          output_location: dist
          app_build_command: npm run build
          api_build_command: npm ci --workspaces=false && npm run build --workspaces=false
